version: '3.8'

services:
  db:
    image: postgis/postgis:latest
    environment:
      POSTGRES_USER: ufo_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ufo_cases
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info
    depends_on: [redis]

volumes:
  postgres_data: